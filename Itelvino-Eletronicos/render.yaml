services:
  - type: web
    name: itelvino-eletronicos
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_server.py
    healthCheckPath: /
    envVars:
      - key: ITELVINO_DATA_DIR
        value: /var/data
      - key: ITELVINO_PUBLIC
        value: "1"
      - key: ITELVINO_SETUP_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: itelvino-data
      mountPath: /var/data
      sizeGB: 1
